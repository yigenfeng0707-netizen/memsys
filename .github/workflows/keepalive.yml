name: Keep Studio Alive

on:
  schedule:
    # Every 5 minutes, staggered entries avoiding minute :00 (GitHub cron
    # high-load slot). Empirically GitHub drops most scheduled runs; more
    # staggered slots = higher chance at least one fires each 30min window.
    - cron: '4-59/10 * * * *'
    - cron: '9-59/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve owner
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MS_OWNER: ${{ secrets.MODELSCOPE_OWNER }}
          MS_REPO: ${{ vars.MS_STUDIO_NAME }}
        run: |
          REPO="${MS_REPO:-memsys-api}"
          if [ -n "$MS_OWNER" ]; then OWNER="$MS_OWNER"; else
            OWNER=$(curl -sS "https://modelscope.cn/openapi/v1/users/me" \
              -H "Authorization: Bearer $MS_TOKEN" \
              | jq -r '.data.username // .Data.Username // .username // empty')
          fi
          [ -n "$OWNER" ] || { echo "::error::Cannot resolve owner"; exit 1; }
          echo "OWNER=$OWNER" >> "$GITHUB_ENV"
          echo "REPO=$REPO" >> "$GITHUB_ENV"

      - name: Ping studio pages
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          BASE="https://$OWNER-$REPO.ms.show"

          # Ping studios page (wakes from sleep)
          curl -sS -A "$UA" -m 60 -o /dev/null -w "studios page: %{http_code}\n" \
            "https://modelscope.cn/studios/$OWNER/$REPO" || true

          # Ping health endpoint
          code=$(curl -sS -A "$UA" -m 300 -o /dev/null -w "%{http_code}" \
            "$BASE/health" || echo "000")
          echo "app health: $code"

          if [ "$code" != "200" ]; then
            echo "::warning::App host unhealthy (HTTP $code) - attempting redeploy trigger"
            # Trigger redeploy if unhealthy
            curl -sS -X POST \
              "https://modelscope.cn/openapi/v1/studios/$OWNER/$REPO/deploy" \
              -H "Authorization: Bearer $MS_TOKEN" \
              -o /dev/null -w "redeploy trigger: %{http_code}\n" || true
          else
            echo "All healthy"
          fi
