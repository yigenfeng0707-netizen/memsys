name: Deploy to ModelScope Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble space directory
        run: |
          set -e
          mkdir -p space-build
          cp requirements.txt Dockerfile space-build/
          cp server.py config.py llm.py store.py pipeline.py extract.py ingest_only.py space-build/
          echo "Space size: $(du -sh space-build | cut -f1)"

      - name: Resolve owner and repo name
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MS_OWNER: ${{ secrets.MODELSCOPE_OWNER }}
          MS_REPO: ${{ vars.MS_STUDIO_NAME }}
        run: |
          if [ -n "$MS_OWNER" ]; then
            OWNER="$MS_OWNER"
          else
            ME=$(curl -sS "https://modelscope.cn/openapi/v1/users/me" -H "Authorization: Bearer $MS_TOKEN")
            echo "users/me => $ME"
            OWNER=$(echo "$ME" | jq -r '.data.username // .Data.Username // .username // empty')
          fi
          [ -n "$OWNER" ] || { echo "::error::Cannot resolve ModelScope owner. Set MODELSCOPE_OWNER secret."; exit 1; }
          REPO="${MS_REPO:-memsys-api}"
          echo "OWNER=$OWNER" >> "$GITHUB_ENV"
          echo "REPO=$REPO" >> "$GITHUB_ENV"

      - name: Ensure studio exists
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          CODE=$(curl -sS -o /tmp/create.json -w "%{http_code}" -X POST \
            "https://modelscope.cn/openapi/v1/studios" \
            -H "Authorization: Bearer $MS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"owner\":\"$OWNER\",\"repo_name\":\"$REPO\",\"sdk_type\":\"docker\",\"display_name\":\"MemSys API\",\"private\":false}")
          echo "create status=$CODE"; cat /tmp/create.json || true
          [ "$CODE" = "200" ] || grep -qiE "exist|duplicate|already" /tmp/create.json || {
            echo "::warning::Studio create returned $CODE (may already exist)"; }

      - name: Sync env vars to ModelScope Studio
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MEMSYS_AUTH_TOKEN: ${{ secrets.MEMSYS_AUTH_TOKEN }}
        run: |
          set -e
          BASE="https://modelscope.cn/openapi/v1/studios/$OWNER/$REPO"

          # Helper: upsert variable (POST create, PUT update on 409)
          # If PUT returns 404, a secret with that key may exist — delete it and retry POST.
          upsert_var() {
            local KEY="$1" VAL="$2"
            local BODY="{\"key\":\"$KEY\",\"value\":\"$VAL\"}"
            CODE=$(curl -sS -o /tmp/var.json -w "%{http_code}" -X POST \
              "$BASE/variables" \
              -H "Authorization: Bearer $MS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$BODY")
            echo "  $KEY POST status=$CODE"
            if [ "$CODE" = "409" ]; then
              CODE=$(curl -sS -o /tmp/var.json -w "%{http_code}" -X PUT \
                "$BASE/variables" \
                -H "Authorization: Bearer $MS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$BODY")
              echo "  $KEY PUT status=$CODE"
              if [ "$CODE" = "404" ]; then
                echo "  $KEY: secret may occupy key, deleting secret and retrying..."
                curl -sS -o /dev/null -X DELETE \
                  "$BASE/secrets" \
                  -H "Authorization: Bearer $MS_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"key\":\"$KEY\"}" || true
                CODE=$(curl -sS -o /tmp/var.json -w "%{http_code}" -X POST \
                  "$BASE/variables" \
                  -H "Authorization: Bearer $MS_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$BODY")
                echo "  $KEY POST(retry) status=$CODE"
              fi
            fi
            cat /tmp/var.json 2>/dev/null || true
          }

          # Sync all env vars as ModelScope variables (NOT secrets).
          # ModelScope secrets are NOT injected into Docker env vars;
          # only plaintext variables are. So we use variables for everything.
          echo "Setting environment variables..."
          if [ -n "$OPENAI_API_KEY" ]; then
            upsert_var "OPENAI_API_KEY" "$OPENAI_API_KEY"
          else
            echo "::warning::OPENAI_API_KEY not set in GitHub - endpoint will fail"
          fi

          if [ -n "$MEMSYS_AUTH_TOKEN" ]; then
            upsert_var "MEMSYS_AUTH_TOKEN" "$MEMSYS_AUTH_TOKEN"
          else
            echo "MEMSYS_AUTH_TOKEN not set - endpoint will be open (no auth)"
          fi

          upsert_var "OPENAI_BASE_URL" "https://api.openai-next.com/v1"
          upsert_var "CHAT_MODEL" "gpt-4o-mini"
          upsert_var "EMBED_MODEL" "text-embedding-3-small"
          upsert_var "MEMSYS_PORT" "7860"
          upsert_var "MEMSYS_DB" "data/memories.db"

      - name: Push code to studio
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -e
          REMOTE="https://oauth2:$MS_TOKEN@www.modelscope.cn/studios/$OWNER/$REPO.git"

          if ! git clone --depth 1 "$REMOTE" ms-studio 2>/tmp/clone.err; then
            echo "clone failed (empty repo?), init fresh: $(cat /tmp/clone.err)"
            mkdir ms-studio && cd ms-studio
            git init -b master
            git remote add origin "$REMOTE"
            cd ..
          fi

          cd ms-studio
          git config user.email "action@github.com"
          git config user.name "gh-action"
          git fetch origin master 2>/dev/null || true
          if git rev-parse --verify origin/master >/dev/null 2>&1; then
            git reset --hard origin/master
          fi

          cp -r ../space-build/. .
          git add -A -f
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy from GitHub ${GITHUB_SHA}"
            git push origin HEAD:master
          fi

      - name: Trigger deployment
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          curl -sS -X POST \
            "https://modelscope.cn/openapi/v1/studios/$OWNER/$REPO/deploy" \
            -H "Authorization: Bearer $MS_TOKEN" || echo "::warning::deploy trigger failed (studio may auto-build on push)"
          echo "Public URL: https://modelscope.cn/studios/$OWNER/$REPO"
          echo "API base will be: https://$OWNER-$REPO.ms.show"

      - name: Wait for deployment and health check
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          BASE="https://$OWNER-$REPO.ms.show"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          echo "Waiting for deployment to complete..."
          sleep 30
          for i in $(seq 1 12); do
            CODE=$(curl -sS -A "$UA" -m 30 -o /dev/null -w "%{http_code}" "$BASE/health" 2>/dev/null || echo "000")
            echo "  attempt $i: health=$CODE"
            if [ "$CODE" = "200" ]; then
              echo "Deployment healthy!"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Health check failed after 12 attempts - check studio logs"
          # Fetch run logs for diagnosis
          curl -sS "https://modelscope.cn/openapi/v1/studios/$OWNER/$REPO/logs/run" \
            -H "Authorization: Bearer $MS_TOKEN" 2>/dev/null | tail -50 || true
